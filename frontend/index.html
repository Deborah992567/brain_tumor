<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI-assisted brain MRI analysis for research and educational purposes. Not a medical diagnosis."
    />
    <title>Brain Tumor AI — AI-Assisted MRI Analysis</title>
    <script>
      // Theme bootstrapped before first paint to avoid flash.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("btai-theme");
        } catch (e) {}
        var theme = stored === "light" || stored === "dark" ? stored : null;
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
