name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: python -m pytest -p no:cacheprovider

      - name: Verify production import
        run: python -c "import app.main"

  frontend:
    name: Frontend (type-check, build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm test

  design-audit:
    name: Design audit (zero gradients)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce flat design system
        run: |
          if grep -rinE "(linear|radial|conic)-gradient|gradient" frontend/src frontend/index.html; then
            echo "::error::Frontend must use a flat design system — gradients are forbidden."
            exit 1
          fi
          echo "Audit passed: no gradients found."